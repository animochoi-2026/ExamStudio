name: Shared document export contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      EXAM_EXPORT_PYTHON: python
      EXAM_EXPORT_TEST_OUTPUT: tests/artifacts/export-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install python-docx==1.2.0 lxml==6.0.0 pillow==11.3.0
      - run: npm run test:export
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: python scripts/prepare-web-python.py
      - run: node tests/export-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-contract-results
          path: tests/artifacts/export-contract/results
