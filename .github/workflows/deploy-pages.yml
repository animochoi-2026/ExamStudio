name: Build reviewed ExamStudio source manually
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full reviewed source commit SHA
        required: true
        type: string
      deploy:
        description: Deploy this reviewed source to production
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: examstudio-shared-bank-production
  cancel-in-progress: false
jobs:
  pages:
    if: github.repository == 'animochoi-2026/ExamStudio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the exact reviewed commit
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: test "$REVIEWED_COMMIT" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install python-docx pillow lxml
      - name: Validate shared baseline and regression contracts
        run: node scripts/canonical-release.cjs verify
      - name: Validate public configuration
        env:
          BANK_PUBLIC_CONFIG: ${{ vars.BANK_PUBLIC_CONFIG }}
        run: |
          node -e "const fs=require('fs'),c=require('./app/shared-bank-auth.cjs').configuration(JSON.parse(process.env.BANK_PUBLIC_CONFIG));fs.mkdirSync('artifacts',{recursive:true});fs.writeFileSync('artifacts/public-config.json',JSON.stringify(c))"
      - name: Build without deploying
        if: ${{ !inputs.deploy }}
        run: node scripts/build-bank-web.cjs artifacts/public-config.json web-bank/dist
      - name: Deploy reviewed source only
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/canonical-release.cjs deploy artifacts/public-config.json web-bank/dist
