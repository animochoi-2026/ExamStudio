name: Build reviewed ExamStudio source manually
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Full reviewed source commit SHA
        required: true
        type: string
      deploy:
        description: Deploy this reviewed source to production
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: examstudio-shared-bank-production
  cancel-in-progress: false
jobs:
  pages:
    if: github.repository == 'animochoi-2026/ExamStudio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the exact reviewed commit
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: test "$REVIEWED_COMMIT" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install python-docx pillow lxml
      - name: Validate public configuration and build current source
        env:
          BANK_PUBLIC_CONFIG: ${{ vars.BANK_PUBLIC_CONFIG }}
        run: |
          node -e "const fs=require('fs'),c=require('./app/shared-bank-auth.cjs').configuration(JSON.parse(process.env.BANK_PUBLIC_CONFIG));fs.writeFileSync('public-config.json',JSON.stringify(c))"
          node scripts/build-bank-web.cjs public-config.json web-bank/dist
      - name: Deploy reviewed source only
        if: inputs.deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages deploy web-bank/dist --project-name=examstudio-shared-bank --branch=main --commit-hash=${{ github.sha }}
